<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 66" width="1000" height="66" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif"><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sl{animation:sl 4.5s ease-in-out infinite} @keyframes sl{from{transform:translateX(-260px)}to{transform:translateX(1000px)}}
.dot{transform-box:fill-box;transform-origin:center;animation:dt 2s ease-in-out infinite} @keyframes dt{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.8);opacity:.35}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<clipPath id="k"><rect x="24" y="56" width="952" height="3"/></clipPath></defs>
<rect width="1000" height="66" rx="14" fill="#060a12"/>
<text x="24" y="40" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="15" fill="#22D3EE">// 02</text>
<text x="84" y="43" font-size="32" font-weight="800" fill="#f1f7ff" letter-spacing="1.5">TECH STACK</text>
<rect x="24" y="56" width="952" height="3" rx="1.5" fill="#fff" fill-opacity=".07"/>
<g clip-path="url(#k)"><rect class="sl" y="56" width="260" height="3" fill="url(#g)"/></g>
<circle class="dot" cx="968" cy="30" r="5" fill="#22D3EE"/>
</svg>