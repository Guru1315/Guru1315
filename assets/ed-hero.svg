<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580"><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.wd{animation:wd 12s infinite backwards}
@keyframes wd{0%{opacity:0;transform:translateY(16px)}4%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-16px)}}
.sw{stroke-dasharray:560;animation:sw 6s ease-in-out infinite}
@keyframes sw{0%{stroke-dashoffset:560}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-560}}
.rot{transform-origin:850px 250px;animation:rot 22s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.dn{animation:dn 1.6s ease-in-out infinite}
@keyframes dn{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.9);opacity:.3}}
