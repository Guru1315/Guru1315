<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity=".6"/></filter>
<clipPath id="cc"><rect x="6" y="6" width="318" height="258" rx="22"/></clipPath></defs>
<rect x="10" y="14" width="310" height="252" rx="22" fill="#000" opacity=".45"/>
<rect x="6" y="6" width="318" height="258" rx="22" fill="url(#cb)"/>
