<rect x="6" y="6" width="318" height="5" fill="url(#ca)"/>
<g opacity=".04"><rect class="shine" x="0" y="0" width="60" height="270" fill="#fff" transform="skewX(-20)"/></g></g>
<rect x="6" y="6" width="318" height="258" rx="22" fill="none" stroke="url(#ca)" stroke-opacity=".7" stroke-width="1.4"/>
<ellipse cx="165" cy="127" rx="42" ry="9" fill="#000" opacity=".45"/>
<g class="fa" filter="url(#sh)"><image x="117" y="38" width="96" height="96" xlink:href="data:image/png;base64," /></g>
