<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 330 270" width="330" height="270" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fa{animation:fa 5s ease-in-out infinite}.fb{animation:fa 6.5s ease-in-out infinite}.fc{animation:fa 4s ease-in-out infinite}
@keyframes fa{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.pulse{animation:pl 3.5s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.55}50%{opacity:1}}
.shine{animation:sh 6s linear infinite}@keyframes sh{0%{transform:translateX(-300px)}100%{transform:translateX(1300px)}}
</style><defs>
