<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 28" width="1000" height="28" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fa{animation:fa 5s ease-in-out infinite}.fb{animation:fa 6.5s ease-in-out infinite}.fc{animation:fa 4s ease-in-out infinite}
