.rg{transform-box:fill-box;transform-origin:center;animation:rg 2.8s ease-out infinite} @keyframes rg{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.35);opacity:0}}
</style>
<defs><linearGradient id="b" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="76"><stop offset="0" stop-color="#2DFFB2"/><stop offset=".5" stop-color="#2DFFB2" stop-opacity=".15"/><stop offset="1" stop-color="#2DFFB2"/>
<animateTransform attributeName="gradientTransform" type="rotate" values="0 160.0 38.0;360 160.0 38.0" dur="6s" repeatCount="indefinite"/></linearGradient>
