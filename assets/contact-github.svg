<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 76" width="320" height="76" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif"><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}
