<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230">
<style>
.r{animation:t 12s infinite backwards;clip-path:inset(0 100% 0 0)}
@keyframes t{0%{clip-path:inset(0 100% 0 0);animation-timing-function:steps(26)}14%,30%{clip-path:inset(0 0 0 0)}33%,100%{clip-path:inset(0 100% 0 0)}}
.c{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.r{clip-path:none}.r:not(:first-of-type){display:none}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs>
<rect width="1000" height="230" rx="16" fill="url(#g)"/>
<text x="60" y="104" font-family="Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="58" font-weight="700" fill="#ffffff">Hi, I'm Guru</text>
<text class="r" style="animation-delay:0s" x="60" y="168" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="26" fill="#7dd3fc">&gt; AI Developer</text><text class="r" style="animation-delay:4s" x="60" y="168" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="26" fill="#7dd3fc">&gt; B.Tech CSE (AI) student</text><text class="r" style="animation-delay:8s" x="60" y="168" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="26" fill="#7dd3fc">&gt; I build AI that listens, sees and helps</text>
</svg>