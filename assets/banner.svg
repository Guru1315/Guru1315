<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
<title>Guru Charan M, AI Developer</title>
<style>
.a{animation:d1 9s ease-in-out infinite alternate}
.b{animation:d2 11s ease-in-out infinite alternate}
.c{animation:d3 13s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(120px,30px)}}
@keyframes d2{to{transform:translate(-140px,-20px)}}
@keyframes d3{to{transform:translate(-60px,40px)}}
.s{opacity:0;animation:f 12s infinite}
@keyframes f{0%{opacity:0;transform:translateY(8px)}6%,28%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.s{opacity:0}.s:first-of-type{opacity:1}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0821"/><stop offset="1" stop-color="#1a0f3d"/></linearGradient>
<linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f5d0fe"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
<clipPath id="card"><rect width="1000" height="260" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1000" height="260" fill="url(#bg)"/>
<g filter="url(#blur)">
<circle class="a" cx="170" cy="70" r="110" fill="#ec4899" opacity="0.65"/>
<circle class="b" cx="780" cy="200" r="130" fill="#06b6d4" opacity="0.55"/>
<circle class="c" cx="520" cy="40" r="100" fill="#6366f1" opacity="0.6"/>
</g>
<rect width="1000" height="260" fill="#0d0821" opacity="0.28"/>
<g fill="#ffffff" opacity="0.18">
<circle cx="90" cy="40" r="1.6"/><circle cx="260" cy="210" r="1.4"/><circle cx="430" cy="60" r="1.6"/><circle cx="610" cy="225" r="1.4"/><circle cx="720" cy="48" r="1.8"/><circle cx="890" cy="120" r="1.5"/><circle cx="940" cy="215" r="1.4"/><circle cx="560" cy="150" r="1.2"/>
</g>
<text x="500" y="112" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="64" font-weight="800" letter-spacing="-1" fill="url(#nm)">Guru Charan M</text>
<text x="500" y="152" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="17" font-weight="600" letter-spacing="6" fill="#c4b5fd">AI DEVELOPER</text>
<g font-family="'Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="20" text-anchor="middle" fill="#e0f2fe">
<text class="s" style="animation-delay:0s" x="500" y="198">B.Tech CSE (AI) · Saveetha University</text>
<text class="s" style="animation-delay:4s" x="500" y="198">I build AI that listens, sees and helps</text>
<text class="s" style="animation-delay:8s" x="500" y="198">Build it. Break it. Ship it.</text>
</g>
<rect x="0.75" y="0.75" width="998.5" height="258.5" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
</g>
</svg>
