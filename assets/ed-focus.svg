<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310"><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ln{animation:ln 6s ease-in-out infinite}@keyframes ln{0%{transform:scaleX(0)}40%,70%{transform:scaleX(1)}100%{transform:scaleX(0);transform-origin:right}}
.dy{animation:dy 1.2s ease-in-out infinite}@keyframes dy{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-8px);opacity:1}}
.ap{transform-box:fill-box;transform-origin:center;animation:ap 3s ease-in-out infinite}@keyframes ap{0%,100%{transform:scale(.55)}50%{transform:scale(1)}}
.bv{transform-box:fill-box;transform-origin:center;animation:bv 1s ease-in-out infinite}@keyframes bv{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.sc{animation:sc 2.6s ease-in-out infinite alternate}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(40px)}}
