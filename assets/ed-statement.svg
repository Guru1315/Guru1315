<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 352" width="1000" height="352"><style>@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.mk{transform-origin:left center;transform-box:fill-box;animation:mk 7s ease-in-out infinite}
@keyframes mk{0%{transform:scaleX(0)}25%,80%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
.mk2{animation-delay:.5s}
.cnt{animation:cnt 4s ease-in-out infinite}@keyframes cnt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style><rect x=".5" y=".5" width="999" height="351" rx="0" fill="#F5F2EA" stroke="#D8D3C4"/><text x="48" y="62" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12" font-weight="700" fill="#E8452C" text-anchor="start" letter-spacing="2.5" >IN MY OWN WORDS</text><text x="48" y="140" font-family="Georgia,'Times New Roman',Times,'Noto Serif','DejaVu Serif',serif" font-size="58" font-weight="400" fill="#15130E" text-anchor="start" letter-spacing="0" textLength="640" lengthAdjust="spacingAndGlyphs">I don't just study AI.</text><rect class="mk" x="44" y="170" width="620" height="68" fill="#FFE45C"/><text x="48" y="222" font-family="Georgia,'Times New Roman',Times,'Noto Serif','DejaVu Serif',serif" font-size="58" font-weight="400" fill="#15130E" text-anchor="start" letter-spacing="0" font-style="italic" textLength="610" lengthAdjust="spacingAndGlyphs">I build it, break it,</text><rect class="mk mk2" x="44" y="246" width="360" height="68" fill="#FFE45C"/><text x="48" y="298" font-family="Georgia,'Times New Roman',Times,'Noto Serif','DejaVu Serif',serif" font-size="58" font-weight="400" fill="#15130E" text-anchor="start" letter-spacing="0" font-style="italic" textLength="350" lengthAdjust="spacingAndGlyphs">and ship it.</text><line x1="740" y1="60" x2="740" y2="314" stroke="#D8D3C4"/><g class="cnt"><text x="776" y="160" font-family="Georgia,'Times New Roman',Times,'Noto Serif','DejaVu Serif',serif" font-size="100" font-weight="700" fill="#E8452C" text-anchor="start" letter-spacing="0" >7+</text></g><text x="778" y="196" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12" font-weight="700" fill="#6F6A5E" text-anchor="start" letter-spacing="2.5" >AI PROJECTS</text><g class="cnt" style="animation-delay:.6s"><text x="776" y="292" font-family="Georgia,'Times New Roman',Times,'Noto Serif','DejaVu Serif',serif" font-size="100" font-weight="700" fill="#15130E" text-anchor="start" letter-spacing="0" >4</text></g><text x="778" y="328" font-family="'Helvetica Neue',Helvetica,Arial,'Liberation Sans','DejaVu Sans',sans-serif" font-size="12" font-weight="700" fill="#6F6A5E" text-anchor="start" letter-spacing="2.5" >AI DOMAINS</text></svg>